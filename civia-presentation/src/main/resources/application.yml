server:
  # O Render informa a porta pela variavel PORT
  port: ${PORT:8080}

spring:
  application:
    name: civia-api
  config:
    # Desenvolvimento local: le DB_URL/DB_USER/DB_PASSWORD de um arquivo .env (fora do Git).
    # Em producao (Render) o arquivo nao existe e os valores vem das variaveis de ambiente.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      # O Oracle da FIAP limita conexoes por usuario: pool pequeno
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 20000
  jpa:
    hibernate:
      # As tabelas sao criadas pelo script db/01_ddl.sql; o Hibernate apenas confere
      # se o modelo (entidades) bate com as tabelas do Oracle.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

civia:
  carga-inicial:
    # Garante tipos de servico e perfis (tabelas de dominio) quando estao vazias
    habilitada: ${CIVIA_CARGA_INICIAL:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
